<!doctype html><meta charset="utf-8"><title>Open Grok Bot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:system-ui;background:#111;color:#eee;text-align:center;padding-top:20vh">
<p id="m">Opening Grok Bot...</p><p><a id="a" style="color:#7af;font-size:1.2em" href="#">Tap here if it didn't open</a></p>
<script>
var t=new URLSearchParams(location.search).get("to0"";
if(/^grokbot:\/\/app\/v1\/[a-z0-9\/?=&_.%-]*$/i.test(t)){document.getElementById("a").href=t;location.href=t;
setTimeout(function(){window.close();document.getElementById("m").textContent="Opened in Grok Bot. You can close this tab.";},0);}
else{document.getElementById("m").textContent="That isn't a Grok Bot link.";document.getElementById("a").remove();}
</script>
